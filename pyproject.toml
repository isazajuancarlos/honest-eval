[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "honest-eval"
version = "0.1.1"
description = "Dos primitivas para no mentirte evaluando experimentos temporales: split walk-forward con embargo (sin leakage) y gate de significancia apareado con n efectivo de Kish y cota inferior de confianza."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Juan Carlos Isaza", email = "isazajuancarlos@gmail.com" }]
keywords = ["walk-forward", "backtest", "leakage", "cross-validation", "paired-test", "statistics", "time-series", "significance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
# Python puro, sin dependencias.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/isazajuancarlos/honest-eval"
Issues = "https://github.com/isazajuancarlos/honest-eval/issues"
Blog = "https://xiliux.com/blog/dos-formas-en-que-un-backtest-te-miente"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
